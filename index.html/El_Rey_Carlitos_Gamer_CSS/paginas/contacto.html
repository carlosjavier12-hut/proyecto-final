<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contacta con El Rey Carlitos Gamer.">
    <title>Contacto | El Rey Carlitos Gamer</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/animaciones.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <header class="encabezado">
        <div class="contenedor encabezado-contenido">
            <a class="logo" href="../index.html">👑 EL REY CARLITOS GAMER 🎮</a>
            <nav class="menu">
                <a href="../index.html">Inicio</a>
                <a href="servicios.html">Servicios</a>
                <a href="contacto.html">Contacto</a>
            </nav>
        </div>
    </header>
    <main class="contenedor">
        <section class="seccion contacto">
            <div class="titulo-seccion">
                <p class="etiqueta">HABLEMOS</p>
                <h2>📩 Formulario de contacto</h2>
                <p>Completa tus datos para dejar un mensaje. Este formulario es una demostración y no envía información a un servidor.</p>
            </div>
            <form class="formulario" action="#" method="get">
                <div class="campo">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>
                </div>
                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="Ingresa tu correo" required>
                </div>
                <div class="campo campo-completo">
                    <label for="asunto">Asunto</label>
                    <input type="text" id="asunto" name="asunto" placeholder="Escribe el asunto">
                </div>
                <div class="campo campo-completo">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje"></textarea>
                </div>
                <div class="campo campo-completo">
                    <button class="boton" type="submit">ENVIAR MENSAJE</button>
                </div>
            </form>
        </section>
    </main>
    <footer class="pie">
        <div class="contenedor">
            <h2>👑 EL REY CARLITOS GAMER 🎮</h2>
            <p><a href="../index.html">Volver al inicio</a></p>
            <small>© 2026 El Rey Carlitos Gamer</small>
        </div>
    </footer>
</body>
</html>
